name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Generate database client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run Build
        run: npm run build
        env:
          # Synthetic public identifier for the read-only browser fixture server.
          # This is not a Clerk instance or an authentication credential.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5pbnZhbGlkJA

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check framework rendering and public design
        run: npm run test:e2e:framework
