<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" fill="none" shape-rendering="geometricPrecision">
  <!-- Cadmium Yellow Canvas Background -->
  <rect width="500" height="360" fill="#FFCC00" rx="12"/>

  <!-- Financial Security Grid Pattern -->
  <g opacity="0.15" stroke="#090D14" stroke-width="1" stroke-dasharray="4 4">
    <line x1="30" y1="80" x2="470" y2="80"/>
    <line x1="30" y1="160" x2="470" y2="160"/>
    <line x1="30" y1="240" x2="470" y2="240"/>
    <line x1="125" y1="30" x2="125" y2="330"/>
    <line x1="250" y1="30" x2="250" y2="330"/>
    <line x1="375" y1="30" x2="375" y2="330"/>
  </g>

  <!-- Technical Telemetry Header -->
  <g font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#090D14">
    <rect x="35" y="32" width="165" height="22" rx="4" fill="#090D14"/>
    <text x="117" y="46" fill="#FFCC00" text-anchor="middle">PAYROLL DISPATCH: BACS</text>
    <text x="465" y="46" text-anchor="end" opacity="0.7">SETTLEMENT CYCLE: WEEKLY FRIDAY</text>
  </g>

  <!-- Central Digital Payslip & Direct BACS Card -->
  <g id="payroll-card" transform="translate(110, 75)">
    <rect x="10" y="10" width="260" height="185" rx="8" fill="#090D14" opacity="0.15"/>
    <rect x="0" y="0" width="260" height="185" rx="8" fill="#FFFFFF" stroke="#090D14" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="36" rx="8" fill="#090D14"/>
    <rect x="0" y="28" width="260" height="8" fill="#090D14"/>

    <text x="16" y="23" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="11" fill="#FFCC00">CATCHINGJOBS BACS DISPATCH</text>
    <rect x="200" y="10" width="48" height="16" rx="3" fill="#10B981"/>
    <text x="224" y="21" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">CLEARED</text>

    <g transform="translate(16, 50)" font-family="JetBrains Mono, monospace">
      <text x="0" y="12" font-size="8" fill="#64748B" font-weight="700">WEEKLY DEPOSIT WINDOW</text>
      <text x="0" y="32" font-size="18" fill="#090D14" font-weight="800">EVERY FRIDAY</text>
    </g>

    <g transform="translate(145, 50)" font-family="JetBrains Mono, monospace">
      <rect x="0" y="0" width="100" height="38" rx="4" fill="#FFCC00" stroke="#090D14" stroke-width="1.5"/>
      <text x="50" y="15" font-size="7.5" fill="#090D14" font-weight="700" text-anchor="middle">NET WEEKLY RANGE</text>
      <text x="50" y="31" font-size="12" fill="#090D14" font-weight="800" text-anchor="middle">£650 – £1,100</text>
    </g>

    <line x1="16" y1="100" x2="244" y2="100" stroke="#E2E8F0" stroke-width="1.5"/>

    <g transform="translate(16, 115)" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" fill="#090D14">
      <text x="0" y="10" fill="#64748B">BANK METHOD:</text>
      <text x="120" y="10">UK DIRECT BACS</text>

      <text x="0" y="28" fill="#64748B">PPE DEDUCTION:</text>
      <text x="120" y="28" fill="#10B981">£0.00 (FREE ISSUE)</text>

      <text x="0" y="46" fill="#64748B">TRANSIT DEDUCTION:</text>
      <text x="120" y="46" fill="#10B981">£0.00 (FREE FLEET)</text>
    </g>

    <circle cx="230" cy="155" r="14" fill="#FFCC00" stroke="#090D14" stroke-width="1.5"/>
    <text x="230" y="158" font-family="JetBrains Mono, monospace" font-size="7" font-weight="800" fill="#090D14" text-anchor="middle">BACS</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" fill="#090D14">
    <rect x="40" y="295" width="135" height="26" rx="4" fill="#FFFFFF" stroke="#090D14" stroke-width="1.5"/>
    <circle cx="54" cy="308" r="4" fill="#10B981"/>
    <text x="65" y="311">WEEKLY GUARANTEED</text>

    <rect x="185" y="295" width="135" height="26" rx="4" fill="#FFFFFF" stroke="#090D14" stroke-width="1.5"/>
    <circle cx="199" cy="308" r="4" fill="#090D14"/>
    <text x="210" y="311">DIGITAL PAYSLIPS</text>

    <rect x="330" y="295" width="135" height="26" rx="4" fill="#FFFFFF" stroke="#090D14" stroke-width="1.5"/>
    <circle cx="344" cy="308" r="4" fill="#10B981"/>
    <text x="355" y="311">HOLIDAY ACCRUAL INCL</text>
  </g>
</svg>
